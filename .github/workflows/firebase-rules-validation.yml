name: Firebase Security Rules Isolated Validation

on:
  push:
    branches: [main, master, release/**]
    paths:
      - 'firestore.staged.rules'
      - 'firestore.rules'
      - 'emulator/**'
      - '.github/workflows/firebase-rules-validation.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'firestore.staged.rules'
      - 'firestore.rules'
      - 'emulator/**'
      - '.github/workflows/firebase-rules-validation.yml'
  workflow_dispatch:

jobs:
  validate-security-rules:
    name: Run Firebase Rules Emulator Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java Runtime (Temurin JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Staged Rules Syntax & Execute Emulator Unit Tests
        env:
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8187'
          GCLOUD_PROJECT: 'demo-daily-fresh-rules-test'
        run: |
          npx firebase-tools emulators:exec \
            --project demo-daily-fresh-rules-test \
            --config emulator/firebase.financial.local.json \
            --only firestore \
            "node --test emulator/rules.staged.test.mjs"
